<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#264a3a">
  <title>もぐもぐ - いい店を、みんなの食卓に</title>
</head>
<body>
  <p>読み込み中...</p>
  <script>
    fetch('./main')
      .then(response => {
        if (!response.ok) throw new Error('アプリを読み込めませんでした');
        return response.text();
      })
      .then(source => {
        document.open();
        document.write(source);
        document.close();
      })
      .catch(() => {
        document.body.innerHTML = '<p>読み込みに失敗しました。ページを再読み込みしてください。</p>';
      });
  </script>
</body>
</html>
